{% extends "layout.html" %}

{% block title %}
Dhruv tweet project
{% endblock %}

{% block content %}
    <h1>Welcome to my Tweet Django Project</h1>

    <h2>Register with us!</h2>
    <form method="POST">
        {% csrf_token %}
        {{form.as_p}}

        <button class="btn btn-primary" type="submit">Register</button>
    </form>
    <p>Already have an account? <a href="{% url 'login' %}">Log In Here</a></p>
{% endblock %}
